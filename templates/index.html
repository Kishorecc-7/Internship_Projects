{% extends "base.html" %}

{% block title %}Home | Notes App{% endblock %}

{% block content %}
    <section class="text-center py-5">
        <h1 class="display-6 fw-bold">Welcome to My Notes</h1>
        <p class="lead text-secondary">Keep your ideas organized in one simple place.</p>
        {% if current_user.is_authenticated %}
            <a class="btn btn-primary" href="{{ url_for('list_notes') }}">View All Notes</a>
        {% else %}
            <a class="btn btn-primary" href="{{ url_for('register') }}">Get Started</a>
        {% endif %}
    </section>
{% endblock %}
