{% extends "base.html" %}

{% block title %}Login | My Notes{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h1 class="h2 mb-1">Login</h1>
            <p class="text-secondary mb-4">Access your private notes.</p>

            {% if errors %}
                <div class="alert alert-danger" role="alert"><ul class="mb-0">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>
            {% endif %}

            <form method="post" class="card shadow-sm"><div class="card-body p-4">
                <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" value="{{ email }}" required></div>
                <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div>
                <button class="btn btn-primary" type="submit">Login</button>
            </div></form>
            <p class="mt-3 text-secondary">Need an account? <a href="{{ url_for('register') }}">Register</a>.</p>
        </div>
    </div>
{% endblock %}
