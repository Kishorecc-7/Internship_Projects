<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Rating</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="coffee-icon">☕</div>

            <h1>Coffee Rating</h1>

            <p>Vote for your favorite coffee</p>
        </header>


        <!-- Coffee Section -->
        <main>

            <h2>Choose Your Favorite</h2>

            <!--
                JavaScript will display loading,
                errors, and coffee cards inside this section.
            -->
            <div id="coffee-container" class="coffee-grid">
                <p class="loading-message">Loading coffees...</p>
            </div>

        </main>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
